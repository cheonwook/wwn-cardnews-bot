# ─────────────────────────────────────────────────────────────
#  인스타 카드뉴스 자동화 설정 파일
#  (비밀값은 여기 쓰지 말고 GitHub Secrets 에 넣으세요 — README 참고)
# ─────────────────────────────────────────────────────────────

brand:
  handle: "@wwn.daily"            # 카드 하단에 표시될 내 계정명
  name: "WWN · World Wide News"   # 표지 상단 브랜드명
  editor_label: "에디터의 시선"      # '내 생각' 슬라이드 제목

scout:
  min_likes: 5000                 # 좋아요 기준
  max_age_hours: 48               # 이보다 오래된 게시물은 제외
  candidates_per_alert: 3         # 알림 1회당 후보 수
  prefer_distinct_categories: true

  # 공식 Business Discovery API 로 감시할 해외 계정 (비즈니스/크리에이터 계정만 가능)
  accounts:
    정치:
      - politico
      - nytimes
      - reuters
    시사:
      - bbcnews
      - cnn
      - apnews
    사회:
      - nowthisnews
      - guardian
    경제:
      - wsj
      - bloombergbusiness
      - cnbc
      - theeconomist
    연예:
      - people
      - variety
      - enews
      - billboard

  # 해시태그 인기 게시물 검색 (인스타 정책: 7일 동안 서로 다른 해시태그 30개까지)
  hashtags:
    정치: [uspolitics, worldpolitics]
    시사: [breakingnews, worldnews]
    사회: [socialissues]
    경제: [economy, stockmarket]
    연예: [hollywood, celebritynews]

ai:
  # 모델명은 OpenAI 가 바꾸면 여기만 수정하면 됩니다
  text_model: "gpt-6.1-sol"
  image_model: "gpt-image-2.6-flare"
  image_size: "1088x1360"         # 4:5 세로형 (16의 배수). 실패 시 1024x1536 으로 재시도
  image_quality: "medium"         # low | medium | high
  body_slides: 4                  # 본문 슬라이드 수 (3~6 권장)

publish:
  require_preview: true           # true: /approve 후 미리보기 → /publish 해야 발행
                                  # false: /approve 즉시 인스타 발행
  max_posts_per_day: 3            # 초과 시 경고 (발행은 '/publish force' 로 가능)
  image_host: "github_raw"        # github_raw(공개 리포 필요) | imgbb(IMGBB_API_KEY 필요)
  timezone: "Asia/Seoul"          # 날짜 표기/일일 카운트 기준
  default_hashtags: ["카드뉴스", "해외이슈", "오늘의뉴스"]

graph_api:
  version: "v26.0"
