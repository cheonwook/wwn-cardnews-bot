name: 📝 카드뉴스 직접 만들기
description: 원문을 붙여넣으면 WWN 카드뉴스와 캡션을 만들어 드려요
title: "[카드뉴스] "
body:
  - type: markdown
    attributes:
      value: |
        해외 게시물의 내용을 붙여넣고 **Submit** 을 누르면 3~5분 뒤 미리보기가 댓글로 달려요.
  - type: input
    id: link
    attributes:
      label: 원문 링크
      description: 인스타그램 게시물 주소 (출처 표기에 사용)
      placeholder: https://www.instagram.com/p/...
  - type: input
    id: account
    attributes:
      label: 원문 계정
      description: 출처로 표시할 계정 아이디
      placeholder: "@bbcnews"
  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      options: [시사, 정치, 경제, 사회, 연예]
    validations:
      required: true
  - type: textarea
    id: caption
    attributes:
      label: 원문 내용
      description: 게시물 캡션이나 기사 본문을 그대로 붙여넣으세요 (영어 그대로 OK)
      render: text
    validations:
      required: true
  - type: textarea
    id: take
    attributes:
      label: 내 생각
      description: 느낀 점이나 의견. 비워두면 '에디터의 시선' 장이 빠져요
  - type: input
    id: image
    attributes:
      label: 표지 이미지 주소
      description: 비워두면 AI가 표지 이미지를 새로 만들어요. 직접 쓰려면 이미지 주소(https://...jpg)를 넣으세요
