name: Approve & Publish

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  handle:
    # 리포 주인이 topic-scout 이슈에 '/' 명령을 단 경우에만 실행
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/') &&
      (
        contains(github.event.issue.labels.*.name, 'topic-scout') ||
        (contains(github.event.issue.body, '### 원문 내용') &&
         (startsWith(github.event.comment.body, '/publish') || startsWith(github.event.comment.body, '/skip')))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Playwright 버전 확인
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Chromium 캐시
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (처음 한 번만)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Chromium 시스템 라이브러리 (캐시 사용 시)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - run: python -m bot.approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
