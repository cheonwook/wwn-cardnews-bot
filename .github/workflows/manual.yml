name: Manual Card (반자동)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  make:
    # 리포 주인이 '카드뉴스 직접 만들기' 양식으로 연 Issue, 또는 그 Issue 의 /redo 댓글
    if: >-
      contains(github.event.issue.body, '### 원문 내용') &&
      (
        (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner) ||
        (github.event_name == 'issue_comment' && github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.comment.body, '/redo'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Playwright 버전 확인
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Chromium 캐시
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium (처음 한 번만)
        if: steps.pwcache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do timeout 240 python -m playwright install --with-deps chromium && exit 0; echo "재시도 $i"; done; exit 1
      - name: Chromium 시스템 라이브러리 (캐시 사용 시)
        if: steps.pwcache.outputs.cache-hit == 'true'
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do timeout 150 python -m playwright install-deps chromium && exit 0; echo "재시도 $i"; done; exit 1
      - id: make
        run: python -m bot.manual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: 카드 이미지 압축 파일
        if: steps.make.outputs.dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: cardnews
          path: |
            ${{ steps.make.outputs.dir }}/slide_*.jpg
            ${{ steps.make.outputs.dir }}/caption.txt
          retention-days: 14
